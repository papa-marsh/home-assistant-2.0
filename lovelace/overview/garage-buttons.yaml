type: horizontal-stack
cards:
  - type: custom:button-card
    entity: binary_sensor.east_stall
    icon: |
      [[[ if (entity.state == "on") return "mdi:garage-open"; else return "mdi:garage"; ]]]
    styles:
      card:
        - height: 110px
        - background: |
            [[[
              if (entity.state == "on") return "var(--custom-card-active-background-color)";
              else return "var( --ha-card-background, var(--card-background-color, white) )";
            ]]]
      icon:
        - color: '[[[ return "var(--primary-text-color)"; ]]]'
  - type: custom:button-card
    entity: binary_sensor.west_stall
    icon: |
      [[[ if (entity.state == "on") return "mdi:garage-open"; else return "mdi:garage"; ]]]
    styles:
      card:
        - height: 110px
        - background: |
            [[[
              if (entity.state == "on") return "var(--custom-card-active-background-color)";
              else return "var( --ha-card-background, var(--card-background-color, white) )";
            ]]]
      icon:
        - color: '[[[ return "var(--primary-text-color)"; ]]]'
