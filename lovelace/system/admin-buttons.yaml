type: vertical-stack
cards:
  - type: horizontal-stack
    cards:
      - type: custom:button-card
        name: Restart HASS
        icon: mdi:home-assistant
        tap_action:
          action: call-service
          service: homeassistant.restart
        styles:
          card:
            - height: 104px
      - type: custom:button-card
        name: Reload YAML
        icon: mdi:file-refresh
        tap_action:
          action: call-service
          service: homeassistant.reload_all
        styles:
          card:
            - height: 104px
  - type: horizontal-stack
    cards:
      - type: custom:button-card
        name: Log Out
        icon: mdi:logout
        tap_action:
          action: javascript
          javascript: |
            [[[ this.dispatchEvent(new CustomEvent("hass-logout", { bubbles: true, composed: true })); ]]]
        styles:
          card:
            - height: 104px
      - type: custom:button-card
        show_name: false
        show_icon: false
        tap_action:
          action: none
        styles:
          card:
            - height: 104px
