type: horizontal-stack
cards:
  - type: custom:button-card
    name: Restart HASS
    icon: mdi:home-assistant
    tap_action:
      action: call-service
      service: homeassistant.restart
    styles:
      card:
        - height: 104px
  - type: custom:button-card
    name: Reload YAML
    icon: mdi:file-refresh
    tap_action:
      action: call-service
      service: homeassistant.reload_all
    styles:
      card:
        - height: 104px
